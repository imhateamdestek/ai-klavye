name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Dosyalari listele
        run: |
          echo "=== DEPO ICERIGI ==="
          find . -type f -not -path './.git/*' | sort

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesi uret
        run: xcodegen generate

      - name: Hedefleri listele
        run: xcodebuild -list -project AIKeyboard.xcodeproj

      - name: Derle (imzasiz)
        run: |
          set -o pipefail
          xcodebuild \
            -project AIKeyboard.xcodeproj \
            -scheme AIKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Cikti kontrolu
        run: |
          echo "=== URUN KLASORU ==="
          ls -la build/Build/Products/Release-iphoneos/
          echo ""
          echo "=== .APP ICERIGI ==="
          find build/Build/Products/Release-iphoneos/AIKeyboard.app -type f -exec ls -la {} \;
          echo ""
          echo "=== BOYUT ==="
          du -sh build/Build/Products/Release-iphoneos/AIKeyboard.app
          echo ""
          echo "=== ANA IKILI ==="
          file build/Build/Products/Release-iphoneos/AIKeyboard.app/AIKeyboard || echo "ANA IKILI YOK!"
          echo ""
          echo "=== EKLENTI ==="
          ls -la build/Build/Products/Release-iphoneos/AIKeyboard.app/PlugIns/ 2>/dev/null || echo "PLUGINS KLASORU YOK!"

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AIKeyboard.app Payload/
          zip -qry AIKeyboard.ipa Payload
          echo "=== IPA BOYUTU ==="
          ls -lh AIKeyboard.ipa

      - name: IPA yukle
        uses: actions/upload-artifact@v4
        with:
          name: AIKeyboard-ipa
          path: AIKeyboard.ipa
          retention-days: 30
