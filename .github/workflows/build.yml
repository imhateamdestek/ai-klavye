name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesi uret
        run: xcodegen generate

      - name: Derle (imzasiz)
        run: |
          xcodebuild \
            -project AIKeyboard.xcodeproj \
            -scheme AIKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AIKeyboard.app Payload/
          zip -qry AIKeyboard.ipa Payload

      - name: IPA yukle
        uses: actions/upload-artifact@v4
        with:
          name: AIKeyboard-ipa
          path: AIKeyboard.ipa
          retention-days: 30
